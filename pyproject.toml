[project]
name = "sentinel-mini"
version = "1.0.0"
description = "Python planner / worker / verifier website configuration audit demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "black>=24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.black]
line-length = 110
target-version = ["py311"]

